# pull_request_target runs this workflow and tools/ from the BASE branch. The pull
# request's own code is never checked out or executed: only its trees/ files are
# extracted as data and read by the base copy of the checker.
name: validate
on:
  pull_request_target:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Check every file already on main
        if: github.event_name == 'push'
        run: python -I tools/community_check.py trees
      - name: Fetch the pull request as data
        if: github.event_name == 'pull_request_target'
        env:
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --no-tags "https://github.com/$REPO" "refs/pull/$PR/head:pr"
          if [ "$(git rev-parse pr)" != "$HEAD_SHA" ]; then
            echo "The pull request head moved since this run started; push again or re-run."
            exit 1
          fi
      - name: Exactly one added tree file
        if: github.event_name == 'pull_request_target'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          changes=$(git diff --raw --no-renames "$BASE"...pr)
          count=$(printf '%s\n' "$changes" | grep -c . || true)
          if [ "$count" -ne 1 ] || ! printf '%s\n' "$changes" | grep -Eq '^:000000 100644 [0-9a-f]+ [0-9a-f]+ A[[:space:]]trees/[0-9]{10}/[0-9]{4}-[0-9]{2}-[0-9]{2}-[0-9a-f]{16}\.json$'; then
            echo "A pull request must add exactly one file, trees/<number>/<YYYY-MM-DD>-<16 hex>.json, and change nothing else."
            echo "This pull request changes:"
            printf '%s\n' "$changes"
            exit 1
          fi
      - name: Check the added file with the base checker
        if: github.event_name == 'pull_request_target'
        run: |
          mkdir "$RUNNER_TEMP/pr"
          git archive pr trees | tar -x -C "$RUNNER_TEMP/pr"
          if [ -n "$(find "$RUNNER_TEMP/pr" -type l)" ]; then
            echo "Symbolic links are not allowed under trees/."
            exit 1
          fi
          python -I tools/community_check.py "$RUNNER_TEMP/pr/trees"
